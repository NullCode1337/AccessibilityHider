plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.nullcode.accessibilityhider'
    compileSdk 34

    defaultConfig {
        applicationId "io.github.nullcode.accessibilityhider"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // Classic Xposed API. Provided at runtime by LSPosed — compileOnly is correct,
    // do NOT change this to implementation or you'll bundle a conflicting copy.
    compileOnly 'de.robv.android.xposed:api:82'
}
